<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Монитор системы AgroDron</title>
  <style>
    :root {
      --bg: #0b0f15;
      --grid: rgba(255, 255, 255, 0.04);
      --panel: #121a24;
      --panel2: #172230;
      --border: #2c3a4f;
      --text: #e6edf3;
      --muted: #8b9cb3;
      --accent: #58a6ff;
      --ok: #3fb950;
      --warn: #d29922;
      --err: #f85149;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px 20px 32px;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      background:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px),
        var(--bg);
      background-size: 22px 22px, 22px 22px, auto;
      line-height: 1.45;
    }
    h1 { font-size: 1.3rem; margin: 0 0 8px; }
    .sub { color: var(--muted); font-size: 0.86rem; margin: 0 0 14px; }
    .sub a { color: var(--accent); }
    .tabs { display: flex; gap: 10px; margin-bottom: 16px; }
    .tab {
      border: 1px solid var(--border);
      background: #0f1621;
      color: var(--muted);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    .tab.active { color: var(--text); border-color: var(--accent); box-shadow: inset 0 0 0 1px rgba(88,166,255,0.25); }
    .page { display: none; }
    .page.active { display: block; }
    section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
    }
    section h2 { margin: 0 0 12px; font-size: 1rem; color: var(--muted); }
    .banner-err, .banner-warn {
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 0.9rem;
    }
    .banner-err { background: rgba(248,81,73,0.12); border: 1px solid var(--err); color: #ffb4b0; }
    .banner-warn { background: rgba(210,153,34,0.12); border: 1px solid var(--warn); color: #e3b565; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 960px) { .grid2 { grid-template-columns: 1fr; } }
    pre.json {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: ui-monospace, monospace;
      font-size: 0.78rem;
      color: #c9d1d9;
    }
    table.telemetry { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    table.telemetry th, table.telemetry td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
    table.telemetry th { color: var(--muted); width: 34%; font-weight: 500; }
    .journal-list { display: flex; flex-direction: column; gap: 10px; max-height: 62vh; overflow-y: auto; }
    .event-card { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; background: rgba(0,0,0,0.2); }
    .event-card .meta { font-size: 0.75rem; color: var(--muted); margin-bottom: 6px; }
    .event-card .title { font-weight: 600; color: var(--accent); margin-bottom: 4px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.72rem; background: #21262d; color: var(--muted); }
    .cockpit-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(230px, 1fr));
      gap: 16px;
    }
    @media (max-width: 1100px) { .cockpit-grid { grid-template-columns: repeat(2, minmax(220px, 1fr)); } }
    @media (max-width: 760px) { .cockpit-grid { grid-template-columns: 1fr; } }
    .component-card {
      min-height: 220px;
      border: 2px solid var(--border);
      border-radius: 14px;
      background: linear-gradient(180deg, #111a26 0%, #0d141e 100%);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .component-name { font-size: 1.15rem; font-weight: 700; letter-spacing: 0.2px; }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: fit-content;
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 0.78rem;
      font-weight: 600;
      border: 1px solid transparent;
    }
    .status-ok { color: #c8f0cf; background: rgba(63,185,80,0.14); border-color: rgba(63,185,80,0.45); }
    .status-warn { color: #ffe0a3; background: rgba(210,153,34,0.12); border-color: rgba(210,153,34,0.45); }
    .status-err { color: #ffb4b0; background: rgba(248,81,73,0.12); border-color: rgba(248,81,73,0.45); }
    .kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; margin-top: 4px; font-size: 0.88rem; }
    .kv .k { color: var(--muted); }
    .mono { font-family: ui-monospace, monospace; font-size: 0.75rem; color: #c9d1d9; margin-top: auto; }
  </style>
</head>
<body>
  <h1>Монитор системы</h1>
  <p class="sub">API: <a href="/api/snapshot">/api/snapshot</a> · <a href="/api/journal">/api/journal</a> · <a href="/api/telemetry">/api/telemetry</a></p>

  <div class="tabs">
    <button id="tab1" class="tab active" type="button">Основной экран</button>
    <button id="tab2" class="tab" type="button">Приборная панель</button>
  </div>

  <div id="page1" class="page active">
    <div class="grid2">
      <section>
        <h2>Телеметрия (последний опрос)</h2>
        <div id="telErr"></div>
        <div id="telBody"></div>
      </section>
      <section>
        <h2>Журнал событий</h2>
        <div id="logBody" class="journal-list"></div>
      </section>
    </div>
  </div>

  <div id="page2" class="page">
    <section>
      <h2>Состояние компонентов в реальном времени</h2>
      <div id="cockpitMeta" class="sub"></div>
      <div id="cockpitGrid" class="cockpit-grid"></div>
    </section>
  </div>

  <script>
  const EVENT_RU = {
    "NAVIGATION_SITL_NO_DATA": "Навигация: нет данных от SITL",
    "AUTOPILOT_MISSION_COMPLETED": "Миссия завершена",
    "SITL_MOTORS_OUT": "Команда на двигатели",
  };

  function escapeHtml(s) { const d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }
  function fmtTime(ts) {
    if (ts == null || ts === 0) return "—";
    const d = new Date(typeof ts === "number" ? ts * 1000 : Date.parse(ts));
    if (isNaN(d.getTime())) return String(ts);
    return d.toLocaleString("ru-RU", { dateStyle: "short", timeStyle: "medium" });
  }
  function fmtPollTs(v) {
    if (v == null || v === 0) return "—";
    if (typeof v === "number" && v > 1e12) return fmtTime(v / 1000);
    if (typeof v === "number") return fmtTime(v);
    return String(v);
  }
  function ruEvent(name) { return EVENT_RU[name] || name || "—"; }

  function setPage(page) {
    document.getElementById("page1").classList.toggle("active", page === 1);
    document.getElementById("page2").classList.toggle("active", page === 2);
    document.getElementById("tab1").classList.toggle("active", page === 1);
    document.getElementById("tab2").classList.toggle("active", page === 2);
  }
  document.getElementById("tab1").onclick = () => setPage(1);
  document.getElementById("tab2").onclick = () => setPage(2);

  function renderTelemetryBlock(tel, err, ts, dbg, timeoutS) {
    const errEl = document.getElementById("telErr");
    const body = document.getElementById("telBody");
    errEl.innerHTML = "";
    if (err) {
      let extra = "";
      if (dbg) extra += '<div class="sub" style="margin-top:10px;">Диагностика: ' + escapeHtml(dbg) + "</div>";
      if (timeoutS != null) extra += '<div class="sub" style="margin-top:6px;">SYSTEM_MONITOR_TELEMETRY_TIMEOUT_S=' + escapeHtml(String(timeoutS)) + " с</div>";
      errEl.innerHTML = '<div class="banner-err">' + escapeHtml(err) + "</div>" + extra;
    }
    if (!tel) {
      body.innerHTML = '<div class="banner-warn">Снимок телеметрии пока не получен.</div>';
      return;
    }
    const rows = [
      ["Время опроса", fmtPollTs(tel.last_poll_ts)],
      ["Двигатели (motors)", tel.motors ? "<pre class='json'>" + escapeHtml(JSON.stringify(tel.motors, null, 2)) + "</pre>" : "<span class='badge'>нет данных</span>"],
      ["Опрыскиватель (sprayer)", tel.sprayer ? "<pre class='json'>" + escapeHtml(JSON.stringify(tel.sprayer, null, 2)) + "</pre>" : "<span class='badge'>нет данных</span>"],
      ["Навигация (navigation)", tel.navigation ? "<pre class='json'>" + escapeHtml(JSON.stringify(tel.navigation, null, 2)) + "</pre>" : "<span class='badge'>нет данных</span>"],
    ];
    let html = "<table class='telemetry'>";
    rows.forEach(([k, v]) => { html += "<tr><th>" + k + "</th><td>" + v + "</td></tr>"; });
    html += "</table>";
    if (ts) html += "<p class='sub' style='margin-top:10px'>Обновлено UI: " + fmtTime(ts) + "</p>";
    body.innerHTML = html;
  }

  function renderJournal(events) {
    const el = document.getElementById("logBody");
    if (!events || !events.length) {
      el.innerHTML = "<p class='sub'>Событий пока нет.</p>";
      return;
    }
    el.innerHTML = events.slice(-50).map(function(e) {
      const p = e.payload || {};
      const ev = p.event || e.action || "—";
      const src = p.source || "—";
      const details = p.details != null ? p.details : {};
      const detStr = typeof details === "object" ? JSON.stringify(details, null, 2) : String(details);
      return (
        '<div class="event-card">' +
          '<div class="meta">' + fmtTime(e.ts) + " · " + escapeHtml(String(src)) + "</div>" +
          '<div class="title">' + escapeHtml(ruEvent(ev)) + " <span class='badge'>" + escapeHtml(String(ev)) + "</span></div>" +
          (detStr && detStr !== "{}" ? '<pre class="json">' + escapeHtml(detStr) + "</pre>" : "") +
        "</div>"
      );
    }).join("");
  }

  function componentStatus(item) {
    if (!item || item.ok !== true) return { cls: "status-err", text: "OFFLINE", err: item && item.error ? item.error : "нет ответа" };
    const s = item.state || {};
    const st = String(s.state || s.mode || s.status || "").toUpperCase();
    if (st.includes("EMERGENCY") || st.includes("ABORT")) return { cls: "status-err", text: st || "ERROR", err: "" };
    if (st.includes("PAUSE") || st.includes("DEGRADED")) return { cls: "status-warn", text: st || "WARN", err: "" };
    return { cls: "status-ok", text: st || "ONLINE", err: "" };
  }

  function pickMetrics(name, state) {
    if (!state) return {};
    if (name === "autopilot") return { "State": state.state, "Step": state.current_step_index, "Mission": state.mission_id };
    if (name === "navigation") return { "Lat": state.lat, "Lon": state.lon, "Alt": state.alt_m, "GPS": state.gps_valid };
    if (name === "motors") return { "Mode": state.mode, "Temp C": state.temperature_c, "SITL": state.sitl_mode };
    if (name === "sprayer") return { "Mode": state.mode, "Spray": state.spray, "Flow l/m": state.flow_lpm };
    if (name === "limiter") return { "State": state.state, "Deviation m": state.deviation_m, "Emergency": state.emergency };
    if (name === "mission_handler") return { "Mission": state.mission_id, "Loaded": state.mission_loaded, "Validated": state.last_validation_ok };
    if (name === "telemetry") return { "Poll ts": state.last_poll_ts, "Nav": !!state.navigation, "Motors": !!state.motors };
    if (name === "emergensy") return { "State": state.state, "Reason": state.reason };
    return state;
  }

  function renderCockpit(components, ts, timeoutS) {
    const grid = document.getElementById("cockpitGrid");
    const meta = document.getElementById("cockpitMeta");
    meta.innerHTML = "Обновлено: <strong>" + escapeHtml(fmtTime(ts)) + "</strong> · timeout get_state: <strong>" + escapeHtml(String(timeoutS || "—")) + " с</strong>";
    if (!components || Object.keys(components).length === 0) {
      grid.innerHTML = '<div class="banner-warn">Нет данных о компонентах.</div>';
      return;
    }
    const order = ["autopilot","navigation","motors","sprayer","limiter","mission_handler","telemetry","emergensy"];
    grid.innerHTML = order.map(function(name) {
      const item = components[name] || { ok: false, error: "нет ответа" };
      const st = componentStatus(item);
      const state = item.state || {};
      const metrics = pickMetrics(name, state);
      const metricsHtml = Object.entries(metrics).map(([k, v]) => (
        '<div class="k">' + escapeHtml(k) + '</div><div>' + escapeHtml(v == null ? "—" : String(v)) + '</div>'
      )).join("");
      const raw = Object.keys(state).length ? JSON.stringify(state).slice(0, 220) : "";
      return (
        '<div class="component-card">' +
          '<div class="component-name">' + escapeHtml(name) + '</div>' +
          '<div class="status-pill ' + st.cls + '">' + escapeHtml(st.text) + '</div>' +
          (st.err ? '<div class="banner-err" style="margin:0;">' + escapeHtml(st.err) + '</div>' : "") +
          '<div class="kv">' + metricsHtml + '</div>' +
          (raw ? '<div class="mono">' + escapeHtml(raw) + (raw.length >= 220 ? "..." : "") + '</div>' : "") +
        '</div>'
      );
    }).join("");
  }

  async function refresh() {
    try {
      const r = await fetch("/api/snapshot");
      const d = await r.json();
      renderTelemetryBlock(d.telemetry, d.telemetry_error, d.telemetry_ts || null, d.telemetry_debug, d.telemetry_request_timeout_s);
      renderJournal(d.journal_events || []);
      renderCockpit(d.components_snapshot || {}, d.components_ts || null, d.component_request_timeout_s);
    } catch (ex) {
      document.getElementById("telErr").innerHTML = '<div class="banner-err">Ошибка запроса: ' + escapeHtml(String(ex)) + "</div>";
    }
  }
  refresh();
  setInterval(refresh, 2000);
  </script>
</body>
</html>
